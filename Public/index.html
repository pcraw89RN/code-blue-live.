<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CODE BLUE • NCLEX LIVE</title><style>
:root{--bg:#071220;--panel:#13243a;--line:#2c4962;--text:#eaf9ff;--muted:#a1b8cf;--aqua:#56e6ff;--gold:#ffd076}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#193659,#071220 65%);font:16px/1.5 system-ui,Arial;color:var(--text);min-height:100vh}main{width:min(940px,95vw);margin:25px auto 80px}h1{font-size:clamp(2.4rem,7vw,4.2rem);margin:10px 0;line-height:1.1}h2{margin:0 0 14px}h3{margin:10px 0}p{color:var(--muted)}.aqua{color:var(--aqua)}.tag{letter-spacing:3px;color:#8beab5;font-size:12px;font-weight:800}.card{padding:25px;background:linear-gradient(135deg,#132842,#0d1b2c);border:1px solid var(--line);border-radius:22px;margin-top:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.team{padding:15px;border:1px solid var(--line);border-radius:15px;background:#0b1c2f}.team strong{font-size:1.12rem}input,select{width:100%;margin:7px 0 15px;padding:12px;color:var(--text);background:#09172a;border:1px solid #3d5772;border-radius:12px;font:inherit}label{display:block;font-weight:700}button{font:inherit;font-weight:800;cursor:pointer;border:0;border-radius:13px;padding:13px 18px;background:var(--aqua);color:#071a2b;margin:5px}button.alt{background:#283d59;color:white;border:1px solid #58728e}button:disabled{opacity:.45;cursor:not-allowed}.hidden{display:none!important}.code{font-size:clamp(3rem,10vw,5.6rem);font-weight:1000;letter-spacing:10px;color:var(--gold);text-align:center;margin:8px 0}.answer{display:block;text-align:left;width:100%;margin:8px 0;background:#213b5d;color:white;border:2px solid transparent;white-space:normal}.answer.selected{border-color:var(--gold);background:#3a4267}.answer:disabled{opacity:.8}.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:9px;margin:15px 0}.score{background:#08182a;border:1px solid var(--line);padding:13px;border-radius:12px}.score b{font-size:27px}.muted{color:var(--muted)}.ok{color:#73eeb0}.warn{color:#ffd076}.err{color:#ff929c}.rationale{background:#0b1c2e;border-left:3px solid var(--aqua);padding:11px;margin:7px 0;border-radius:5px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.pill{background:#233d55;padding:6px 12px;border-radius:999px}.progress{height:11px;background:#243a52;border-radius:20px;overflow:hidden}.progress div{background:#6ae7ff;height:100%;transition:width .4s}.small{font-size:.86rem}.joinlink{word-break:break-all}</style></head><body><main><div class="top"><div class="tag">🩺 NURSING • LIVE BATTLE</div><div class="pill" id="connection">Connecting…</div></div><h1>CODE <span class="aqua">BLUE</span> ⚡</h1><p>Next Generation NCLEX challenge • Chapters 32–34 • Live factions competition</p><div id="home" class="card"><h2>Play together, from any device</h2><div class="grid"><div><h3>🎙️ I'm the host</h3><label>Number of factions<select id="count"><option>2</option><option>3</option><option>4</option><option selected>5</option></select></label><div id="names"></div><button onclick="create()">Create live room</button></div><div><h3>📲 Join a faction</h3><label>6-digit room code<input id="joinCode" inputmode="numeric" maxlength="6" placeholder="123456"></label><label>Your nickname<input id="nick" maxlength="26" placeholder="Student name"></label><label>Choose faction<select id="choice"><option value="">Create or enter a valid room code first</option></select></label><button onclick="join()">Join game</button></div></div></div><div id="game" class="hidden"><div class="card"><div class="top"><h2 id="role"></h2><span id="phase" class="pill"></span></div><div id="roomCode" class="code"></div><p id="share" class="small joinlink"></p><div id="board" class="board"></div><div id="members"></div></div><div id="hostControls" class="card hidden"><h2>🎙️ Host control room</h2><div id="setup"><label>Questions<select id="length"><option value="10">10 questions · quick round</option><option value="20">20 questions · extended challenge</option><option value="33">33 questions · full contest</option></select></label><label>Seconds per question<select id="seconds"><option value="30">30 seconds</option><option value="45" selected>45 seconds</option><option value="60">60 seconds</option><option value="90">90 seconds</option></select></label><button onclick="start()">🚀 Start competition</button></div><button id="revealBtn" class="alt hidden" onclick="command('revealNow')">Reveal answers now</button><button id="nextBtn" class="hidden" onclick="command('next')">Next question ➜</button><p id="hostMsg"></p></div><div id="questionCard" class="card hidden"><div class="top"><h2 id="qCount"></h2><span id="clock" class="pill"></span></div><div class="progress"><div id="bar"></div></div><p id="qTag" class="tag"></p><h2 id="stem"></h2><p id="instructions"></p><div id="answers"></div><button id="submit" onclick="submitAnswer()">Lock answer 🔒</button><p id="answerStatus"></p></div><div id="feedback" class="card hidden"></div><div id="winner" class="card hidden"></div></div><div id="msg" role="alert" style="margin-top:16px"></div></main><script src="/socket.io/socket.io.js"></script><script>
const $=id=>document.getElementById(id),sock=io(),palette=['#57e6ff','#fbbf24','#b794ff','#65eba5','#ff8fa7'];let S=null,host=false,joined=false,myTeam=-1,selected=[],locked=false,currentQuestion=-1,hostCred=null;
function showMsg(t,err=false){$('msg').textContent=t;$('msg').className=err?'err':'ok'}
function clear(el){el.replaceChildren()}
function textNode(tag,str,cls){let x=document.createElement(tag);x.textContent=str;if(cls)x.className=cls;return x}
function roomNames(){let n=+$('count').value;clear($('names'));for(let i=0;i<n;i++){let label=textNode('label',`Faction ${i+1}`);let input=document.createElement('input');input.id='team'+i;input.maxLength=23;input.value=['Code Blue','Rapid Response','Night Shift','Crash Cart','IV League'][i];label.append(input);$('names').append(label)}}$('count').addEventListener('change',roomNames);roomNames();
function request(e,d,cb){sock.emit(e,d,r=>{if(!r?.ok)showMsg(r?.message||'Something went wrong',true);else{showMsg(r.message||'Success');cb?.(r)}})}
function create(){let n=+$('count').value;request('create',{count:n,names:Array.from({length:n},(_,i)=>$('team'+i).value)},r=>{host=true;joined=false;hostCred={code:r.code,key:r.key};sessionStorage.setItem('cb_host',JSON.stringify(hostCred));showGame()})}
function showGame(){$('home').classList.add('hidden');$('game').classList.remove('hidden');$('hostControls').classList.toggle('hidden',!host)}
function join(){request('join',{code:$('joinCode').value.trim(),name:$('nick').value.trim(),team:+$('choice').value},r=>{host=false;joined=true;myTeam=r.team;showGame()})}
function start(){request('start',{code:S?.code,length:+$('length').value,seconds:+$('seconds').value})}function command(event){request(event,{code:S?.code})}
$('joinCode').addEventListener('input',previewRoom);function previewRoom(){let c=$('joinCode').value.trim();if(c.length!==6)return;sock.emit('preview',c,r=>{if(!r.ok){showMsg(r.message,true);return}if(r.phase!=='lobby'){showMsg('This game has already started',true);return}clear($('choice'));r.teams.forEach(t=>{let o=document.createElement('option');o.value=t.id;o.textContent=t.name;$('choice').append(o)})})}
sock.on('connect',()=>{$('connection').textContent='🟢 Connected';let c=sessionStorage.getItem('cb_host');if(c&&!host){try{let x=JSON.parse(c);request('resumeHost',x,()=>{host=true;joined=false;hostCred=x;showGame()})}catch{}}});sock.on('disconnect',()=>{$('connection').textContent='🔴 Disconnected';showMsg('Connection lost. Reconnecting…',true)});
function updateBoard(){clear($('board'));S.teams.slice().sort((a,b)=>b.score-a.score).forEach(t=>{let d=document.createElement('div');d.className='score';d.style.borderLeft='5px solid '+t.color;d.append(textNode('div',t.name));d.append(textNode('b',String(t.score)));d.append(textNode('div',`${t.members.length} players`,'small muted'));$('board').append(d)})}
function render(){if(!S||(!host&&!joined))return;showGame();$('role').textContent=host?'🎙️ You are the host':`🎯 You are playing for ${S.teams[myTeam]?.name||'your faction'}`;$('phase').textContent=S.phase.toUpperCase();$('roomCode').textContent=S.code;$('share').textContent=`Join link: ${location.origin}/?room=${S.code}`;updateBoard();clear($('members'));if(S.phase==='lobby')S.teams.forEach(t=>$('members').append(textNode('p',`${t.name}: ${t.members.map(m=>m.name).join(', ')||'Waiting…'}`)));
$('setup').classList.toggle('hidden',S.phase!=='lobby');$('revealBtn').classList.toggle('hidden',!host||S.phase!=='question');$('nextBtn').classList.toggle('hidden',!host||S.phase!=='reveal');$('questionCard').classList.toggle('hidden',S.phase!=='question');$('winner').classList.toggle('hidden',S.phase!=='finished');if(S.phase==='question'){if(currentQuestion!==S.round){currentQuestion=S.round;selected=[];locked=false;drawQuestion()}$('qCount').textContent=`Question ${S.round} / ${S.total} · ${S.answered} of ${S.players} answered`;$('submit').classList.toggle('hidden',host||locked)}else{currentQuestion=-1}
if(S.phase==='finished'){let t=S.teams.slice().sort((a,b)=>b.score-a.score);clear($('winner'));$('winner').append(textNode('h2',`🏆 ${t[0]?.name||'No team'} wins!`));t.forEach((v,i)=>$('winner').append(textNode('p',`${i+1}. ${v.name} — ${v.score} points`)))} }
function drawQuestion(){let q=S.question;if(!q)return;$('feedback').classList.add('hidden');$('qTag').textContent=`CHAPTER ${q.ch} · ${q.tag}`;$('stem').textContent=q.stem;$('instructions').textContent=q.kind==='multi'?'Select all that apply.':q.kind==='order'?'Select the actions in the correct order. Tap selected choices to undo.':'Choose the single best answer.';$('answerStatus').textContent=host?'Observe the responses. Your display does not submit an answer.':'';clear($('answers'));q.opts.forEach((v,i)=>{let b=textNode('button',`${String.fromCharCode(65+i)}. ${v}`,'answer');b.disabled=host;b.onclick=()=>{if(locked)return;if(q.kind==='single')selected=[i];else if(q.kind==='multi')selected=selected.includes(i)?selected.filter(x=>x!==i):[...selected,i];else selected=selected.includes(i)?selected.filter(x=>x!==i):[...selected,i];drawChoices()};b.dataset.index=i;$('answers').append(b)});drawChoices()}
function drawChoices(){$('answers').querySelectorAll('button').forEach(b=>{let k=+b.dataset.index;b.classList.toggle('selected',selected.includes(k));let prefix=S.question.kind==='order'&&selected.includes(k)?`${selected.indexOf(k)+1} → `:'';b.textContent=prefix+String.fromCharCode(65+k)+'. '+S.question.opts[k]})}
function submitAnswer(){if(locked||!selected.length)return showMsg('Choose your answer first',true);request('answer',{code:S.code,choices:selected},()=>{locked=true;$('submit').classList.add('hidden');$('answerStatus').textContent='✅ Answer locked. Waiting for the reveal.';$('answers').querySelectorAll('button').forEach(b=>b.disabled=true)})}
sock.on('state',s=>{S=s;if(!host&&myTeam<0&&s.phase==='lobby'){let c=$('joinCode').value; if(s.code===c)updateChoices()}render()});
function updateChoices(){clear($('choice'));S.teams.forEach(t=>{let o=document.createElement('option');o.value=t.id;o.textContent=t.name;$('choice').append(o)})}
sock.on('reveal',r=>{if(!S)return;$('feedback').classList.remove('hidden');clear($('feedback'));$('feedback').append(textNode('h2','🧠 Answer breakdown'));let q=S.question||lastQ;if(q){r.why.forEach((w,i)=>$('feedback').append(textNode('div',`${r.correct.includes(i)?'✅':'•'} ${String.fromCharCode(65+i)}: ${w}`,'rationale')))}let me=r.results.find(x=>x.name===$('nick').value.trim()&&x.team===myTeam);if(me)$('feedback').append(textNode('h3',me.right?`✅ Correct! +${me.points} points`:'Not quite — review the rationale'));});
let lastQ=null;sock.on('state',s=>{if(s.question)lastQ=s.question;else if(s.phase==='lobby'&&s.code===$('joinCode').value)updateChoices()});
const urlRoom=new URLSearchParams(location.search).get('room');if(urlRoom)$('joinCode').value=urlRoom;if(urlRoom.length===6)setTimeout(previewRoom,400);
setInterval(()=>{if(S?.phase==='question'){let left=Math.max(0,S.deadline-Date.now());$('clock').textContent=`⏱ ${Math.ceil(left/1000)}s`;$('bar').style.width=(left/Math.max(1,S.duration||45000)*100)+'%'}},200);
</script></body></html>
